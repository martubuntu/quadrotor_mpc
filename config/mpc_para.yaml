uav_mpc_node:
  ros__parameters:
    # Same real-flight conventions as uav_pid_mavros: manual ARM and OFFBOARD.
    auto_arm: false
    auto_offboard: false
    control_rate_hz: 30.0

    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    mavros_imu_topic: "/mavros/imu/data"
    mavros_attitude_setpoint_topic: "/mavros/setpoint_raw/attitude"
    conflicting_setpoint_topic: "/mavros/setpoint_raw/local"
    trajectory_topic: "/mpc_ref_traj"
    rviz_frame_id: "map"

    # aT [m/s^2] -> normalized PX4 collective thrust.
    # Calibrate hover_thrust on the actual 5 kg aircraft before flight.
    hover_thrust: 0.50
    thrust_min: 0.15
    thrust_max: 0.80
    body_rate_limit: 1.5
    adaptive_thrust_model: false

    # ESO is optional and disabled for the first real-flight deployment.
    use_eso: false
    eso_topic: "/eso/disturbance"
    eso_timeout_sec: 0.20
    eso_limit: 3.0
    trajectory_timeout_sec: 0.50
    prediction_dt: 0.10

    bounds:
      specific_thrust_max: 20.0
      specific_thrust_min: 2.0
      wx_max: 1.5
      wx_min: -1.5
      wy_max: 1.5
      wy_min: -1.5
      wz_max: 1.0
      wz_min: -1.0

    cost:
      px: 100.0
      py: 100.0
      pz: 100.0
      qw: 100.0
      qx: 100.0
      qy: 100.0
      qz: 100.0
      vx: 30.0
      vy: 30.0
      vz: 30.0
      specific_thrust: 30.0
      wx: 30.0
      wy: 30.0
      wz: 30.0

circle_traj_node:
  ros__parameters:
    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    trajectory_topic: "/mpc_ref_traj"
    radius: 1.5
    linear_speed: 0.20
    height: 0.0
    cycles: 1
    transition_time: 8.0
    publish_rate: 30.0
    horizon_steps: 20
    horizon_dt: 0.1
