uav_mpc_node:
  ros__parameters:
    # -------------------------------------------------------------
    # 主模式开关：is_sim 控制仿真与实机环境切换
    # false = 实机飞行模式（手动起飞定点悬停后切 OFFBOARD，安全第一，3.5kg 平台推力 0.72）
    # true  = Gazebo 仿真模式（自动起飞爬升到 1.5m，自动切 OFFBOARD + ARM，Iris 仿真推力 0.58）
    # -------------------------------------------------------------
    is_sim: false

    # 3.5 kg 实机平台悬停油门 (基于实测 ULog 标定真值: 0.724)
    hover_thrust: 0.72

    # Gazebo Iris 仿真模型悬停油门 (is_sim=true 时自动使用)
    sim_hover_thrust: 0.58

    # 仿真模式下目标起飞爬升高度 (m)
    takeoff_height: 1.5

    # 通用控制参数
    control_rate_hz: 30.0
    thrust_min: 0.15
    thrust_max: 0.88
    body_rate_limit: 1.2
    adaptive_thrust_model: false

    # ESO 扰动观测器配置
    use_eso: false
    eso_topic: "/eso/disturbance"
    eso_timeout_sec: 0.20
    eso_limit: 3.0
    trajectory_timeout_sec: 0.50
    prediction_dt: 0.10

    # 通信话题
    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    mavros_imu_topic: "/mavros/imu/data"
    mavros_attitude_setpoint_topic: "/mavros/setpoint_raw/attitude"
    conflicting_setpoint_topic: "/mavros/setpoint_raw/local"
    trajectory_topic: "/mpc_ref_traj"
    rviz_frame_id: "map"

    # MPC 物理边界 (温和限幅，严禁暴力冲顶与剧烈晃动)
    bounds:
      specific_thrust_max: 11.0    # 悬停基线为 9.8m/s²，11.0 限制最大爬升过载为 ~1.12g，温和安全
      specific_thrust_min: 7.0     # 限制最大下坠速度，防止猛掉高
      wx_max: 1.0
      wx_min: -1.0
      wy_max: 1.0
      wy_min: -1.0
      wz_max: 0.8
      wz_min: -0.8

    # MPC 状态权重 (Q, R): 增强速度阻尼，杜绝位置阶跃引起的剧烈超调
    cost:
      px: 60.0
      py: 60.0
      pz: 60.0
      qw: 100.0
      qx: 100.0
      qy: 100.0
      qz: 100.0
      vx: 40.0
      vy: 40.0
      vz: 40.0
      specific_thrust: 20.0
      wx: 20.0
      wy: 20.0
      wz: 20.0

circle_traj_node:
  ros__parameters:
    is_sim: false
    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    trajectory_topic: "/mpc_ref_traj"
    radius: 1.5
    linear_speed: 0.20
    cycles: 1
    transition_time: 8.0
    # 仿真阶段一起飞悬停延时时间 (s)，实机自动置为 0.0
    sim_start_delay_sec: 10.0
    publish_rate: 30.0
    horizon_steps: 20
    horizon_dt: 0.1

data_logger_node:
  ros__parameters:
    save_dir: "data/jetson_flyrecord"
    log_prefix: "NMPC"
    log_rate: 30.0
    odom_topic: "/mavros/local_position/odom"
    ref_topic: "/circle_traj/current_ref"
    battery_topic: "/mavros/battery"
