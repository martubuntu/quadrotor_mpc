# Quadrotor MPC Control Parameters for Gazebo SITL Simulation (Iris Model)
uav_mpc_node:
  ros__parameters:
    # Autonomous Gazebo Simulation setup
    auto_arm: true
    auto_offboard: true
    takeoff_height: 1.5
    control_rate_hz: 30.0

    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    mavros_imu_topic: "/mavros/imu/data"
    mavros_attitude_setpoint_topic: "/mavros/setpoint_raw/attitude"
    conflicting_setpoint_topic: "/mavros/setpoint_raw/local"
    trajectory_topic: "/mpc_ref_traj"
    rviz_frame_id: "map"

    # Gazebo Iris model hover thrust is ~0.58
    hover_thrust: 0.58
    thrust_min: 0.15
    thrust_max: 0.85
    body_rate_limit: 2.5
    adaptive_thrust_model: false

    # ESO is optional in simulation
    use_eso: false
    eso_topic: "/eso/disturbance"
    eso_timeout_sec: 0.20
    eso_limit: 3.0
    trajectory_timeout_sec: 0.50
    prediction_dt: 0.10

    bounds:
      specific_thrust_max: 25.0
      specific_thrust_min: 2.0
      wx_max: 2.5
      wx_min: -2.5
      wy_max: 2.5
      wy_min: -2.5
      wz_max: 1.5
      wz_min: -1.5

    cost:
      px: 120.0
      py: 120.0
      pz: 150.0
      qw: 100.0
      qx: 100.0
      qy: 100.0
      qz: 100.0
      vx: 35.0
      vy: 35.0
      vz: 40.0
      specific_thrust: 25.0
      wx: 25.0
      wy: 25.0
      wz: 25.0

circle_traj_node:
  ros__parameters:
    mavros_state_topic: "/mavros/state"
    mavros_odom_topic: "/mavros/local_position/odom"
    trajectory_topic: "/mpc_ref_traj"
    radius: 1.5
    linear_speed: 0.30
    height: 1.5
    cycles: 2
    transition_time: 6.0
    start_delay_sec: 6.0
    publish_rate: 30.0
    horizon_steps: 20
    horizon_dt: 0.1
